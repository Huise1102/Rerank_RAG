# 校园 RAG 三端 Nginx 配置示例
# 使用前替换 server_name、证书路径与代码目录
# 关键点：
#   1. 前端构建产物分别在 dist/admin、dist/user、dist/mobile
#   2. 三个站点都以 /api/ 前缀反代到后端，与 VITE_API_BASE_URL=/api/v1 对应
#   3. 问答使用 SSE 流式输出，必须关闭 proxy_buffering

# 管理端
server {
    listen 80;
    server_name admin.example.edu.cn;

    root /opt/campus-rag/current/frontend/dist/admin;
    index index.html;
    client_max_body_size 25m;

    location /api/ {
        proxy_pass http://127.0.0.1:8004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8004/health;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|svg|woff2)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}

# 用户端（PC）
