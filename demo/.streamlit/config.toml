# Streamlit 运行配置
#
# 主题说明
# 界面样式主要由 app.py 的 inject_theme() 注入的 CSS 决定，保证配色只有一个来源。
# primaryColor 是唯一写入主题令牌的颜色，用于 st.toggle 开启状态的轨道底色。
# 该控件没有稳定的类名可供 CSS 定位，app.py 中另有一条同色规则作为补充。
# 其余颜色由 app.py 的 CSS 控制，配色总表见 app.py 顶部注释。
#
# 关闭侧边栏自动导航，本项目是单页应用，自动生成的导航会占用侧边栏高度。

[client]
showSidebarNavigation = false
toolbarMode = "minimal"        # 隐藏右上角部署菜单
showErrorDetails = true

[theme]
base = "light"                 # 明暗基调，其余颜色由 app.py 控制
primaryColor = "#3b7dd8"       # 开关开启状态的颜色

[server]
headless = true
port = 5171                      # 前端端口
fileWatcherType = "auto"
# 排除虚拟环境、数据、索引、日志与缓存目录，避免无意义的重载
folderWatchBlacklist = [".venv", "data", "indexes", "logs", "__pycache__"]
# 修改文件后不自动重跑，刷新页面时重新执行脚本
runOnSave = false

[browser]
gatherUsageStats = false
